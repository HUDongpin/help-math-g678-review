<!doctype html>
<html lang="en"><meta charset="utf-8"><link rel="icon" href="data:,">
<title>Origin — local drawing verification</title>
<style>body{margin:16px;font:16px system-ui}canvas{display:block;width:min(800px,100%);height:auto}button,input{font:inherit;margin:8px}</style>
<p>Local source drawing candidate. My Lesson glossary and audio integration are pending.</p>
<label>Frame <input id="frame" type="number" min="1" max="118" value="1"></label>
<button id="replay">Replay</button><output id="status"></output>
<canvas width="800" height="600" id="stage"></canvas>
<script src="canvas-renderer.js"></script>
<script>
const asset = HELP_MATH_CANVAS_ASSETS['shared-alg001-l12-p011'];
const stage = document.getElementById('stage');
const input = document.getElementById('frame');
async function render(frame) {
  await asset.ready();
  const state = asset.render(stage, {frame, scenario: 'source-static-frame', language: 'en', seed: 0});
  input.value = String(frame);
  document.getElementById('status').textContent = JSON.stringify({frame:state.localFrame,domain:state.frameDomain});
}
input.addEventListener('change', () => render(Number(input.value)));
document.getElementById('replay').addEventListener('click', () => render(1));
render(1);
</script></html>
